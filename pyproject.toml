[project]
name = "jev-abr-geocoder"
version = "0.1.0"
description = "Address Base Registry geocoder: trie prefix match + Jev (TypeSafe System One) reranking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typesafe-sdk>=0.7",
    "marisa-trie>=1.2",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.scripts]
jev-abr-geocoder = "jev_abr_geocoder.cli:app"

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "pyright>=1.1.390"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_abr_geocoder"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
